name: publish-npm

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        environment: npm
        concurrency:
            group: publish-npm-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"

            - name: Verify build
              run: |
                  go vet ./...
                  go test ./...

            - name: Set version
              run: npm version "$(node -p "require('./package.json').version")" --no-git-tag-version

            - name: Publish Package
              run: npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
