name: test

on:
    pull_request:
    push:
        branches:
            - main
            - master

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Check formatting
              run: |
                  if [ -n "$(gofmt -l .)" ]; then
                    echo "gofmt needed for:"
                    gofmt -l .
                    exit 1
                  fi

            - name: Go Vet
              run: go vet ./...

            - name: Go Test
              run: go test ./...

            - name: Smoke Test
              run: npm test

            - name: Benchmark (Non-blocking)
              continue-on-error: true
              run: go test ./cmd/fpf -bench BenchmarkDynamicReloadPipeline -benchmem -run '^$'
